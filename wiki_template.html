<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Spline+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="appstyle">
:root{
  --paper:#E6E8E1; --card:#F0F1EB; --inset:#DCDFD5; --ink:#15303A; --ink2:#3A5560;
  --muted:#6A7A76; --accent:#1F6F8B; --accent2:#B07A2E; --line:#CBD1C6; --line2:#DDE1D6;
  --link:#1C6883; --good:#3E7D5A; --danger:#9C4A34;
  --era-pirate:#8A5A2B; --era-colonial:#7A6A3A; --era-independence:#2E6E7E; --era-modern:#1F6F8B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1C22; --card:#14282F; --inset:#1B333C; --ink:#E7ECE6; --ink2:#B7C4C4;
  --muted:#84979A; --accent:#4FA5C0; --accent2:#D19A4E; --line:#264049; --line2:#1B333C;
  --link:#6FB9CF; --good:#63B08A; --danger:#D98a72;
  --era-pirate:#C9924E; --era-colonial:#B7A465; --era-independence:#5FA6B6; --era-modern:#4FA5C0;
}}
:root[data-theme="dark"]{
  --paper:#0E1C22; --card:#14282F; --inset:#1B333C; --ink:#E7ECE6; --ink2:#B7C4C4;
  --muted:#84979A; --accent:#4FA5C0; --accent2:#D19A4E; --line:#264049; --line2:#1B333C;
  --link:#6FB9CF; --good:#63B08A; --danger:#D98A72;
  --era-pirate:#C9924E; --era-colonial:#B7A465; --era-independence:#5FA6B6; --era-modern:#4FA5C0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'Spline Sans',system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}

/* ── layout shell ── */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);
  border-right:1px solid var(--line);padding:1.4rem 1.1rem;display:flex;flex-direction:column;gap:1.1rem}
.main{min-width:0;padding:clamp(1.4rem,3.5vw,3rem) clamp(1.1rem,4vw,3.4rem);max-width:1120px}

/* ── brand ── */
.brand{display:block}
.brand .mark{font-family:'Fraunces',serif;font-weight:600;font-size:1.75rem;letter-spacing:-.02em;
  line-height:1;color:var(--ink)}
.brand .mark em{font-style:italic;color:var(--accent)}
.brand .tag{font-size:11px;color:var(--muted);letter-spacing:.02em;margin-top:.4rem;line-height:1.4}

/* ── search ── */
.search{position:relative}
.search input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:7px;
  padding:.55rem .7rem;font-size:13.5px;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);
  max-height:340px;overflow-y:auto;z-index:40;display:none}
.results.open{display:block}
.results a{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;
  padding:.5rem .7rem;border-bottom:1px solid var(--line2);color:var(--ink)}
.results a:last-child{border-bottom:none}
.results a:hover,.results a.active{background:var(--inset);text-decoration:none}
.results .rn{font-size:13.5px}
.results .rt{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}

/* ── nav ── */
nav.primary{display:flex;flex-direction:column;gap:1px}
.navlabel{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:.3rem 0 .35rem .15rem}
nav.primary a{display:flex;justify-content:space-between;align-items:center;padding:.42rem .6rem;
  border-radius:6px;color:var(--ink2);font-size:13.5px}
nav.primary a:hover{background:var(--inset);text-decoration:none;color:var(--ink)}
nav.primary a.active{background:var(--inset);color:var(--ink);font-weight:500;
  box-shadow:inset 3px 0 0 var(--accent)}
nav.primary a .ct{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sb-foot{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line2);padding-top:.9rem}
.sb-foot button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink2);
  padding:.3rem .55rem;font-size:11px;margin-top:.5rem}
.sb-foot button:hover{border-color:var(--accent);color:var(--ink)}
.statuschip{display:inline-flex;align-items:center;gap:.35rem;font-size:11px;padding:.2rem .5rem;
  border-radius:20px;background:var(--inset);color:var(--muted)}
.statuschip.saving{color:var(--accent2)} .statuschip.saved{color:var(--good)}
.statuschip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}

/* ── eyebrows / headings ── */
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1.title{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(2rem,4.5vw,3.1rem);
  line-height:1.05;letter-spacing:-.015em;text-wrap:balance;margin:.35rem 0 .2rem}
h2.sec{font-family:'Fraunces',serif;font-weight:500;font-size:1.4rem;letter-spacing:-.01em;
  margin:2.2rem 0 .9rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin-bottom:.5rem}
p{margin-bottom:.85rem;max-width:66ch;color:var(--ink2)}
.lead{font-size:1.05rem;color:var(--ink2);max-width:64ch}

/* ── article + infobox ── */
.article{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:2.4rem;align-items:start}
.artbody{min-width:0}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:.4rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--muted)} .crumbs .sep{opacity:.5}
.mono{font-family:'IBM Plex Mono',monospace}

.infobox{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  position:sticky;top:1.4rem}
.infobox .ib-head{padding:.85rem 1rem;background:var(--inset);border-bottom:1px solid var(--line)}
.infobox .ib-type{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:600}
.infobox .ib-name{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:500;line-height:1.15;margin-top:.15rem}
.infobox dl{padding:.4rem 1rem .8rem}
.infobox .row{display:grid;grid-template-columns:96px 1fr;gap:.5rem;padding:.45rem 0;
  border-bottom:1px solid var(--line2);font-size:12.5px}
.infobox .row:last-child{border-bottom:none}
.infobox dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.infobox dd{color:var(--ink);min-width:0}
.infobox dd a{overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{display:inline-block;font-size:11px;padding:.15rem .5rem;border-radius:20px;background:var(--inset);
  color:var(--ink2);border:1px solid var(--line2)}
.chip.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

/* ── fact grid / connections ── */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.7rem;margin:.4rem 0 .5rem}
.fact{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:.7rem .85rem}
.fact .k{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.fact .v{font-size:1.3rem;font-family:'Fraunces',serif;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:.15rem;line-height:1.1}
.fact .v.sm{font-size:1rem}
.conns{display:flex;flex-direction:column;gap:.5rem}
.conn{display:flex;gap:.7rem;align-items:baseline;padding:.5rem .2rem;border-bottom:1px solid var(--line2)}
.conn:last-child{border-bottom:none}
.conn .rel{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  min-width:110px;flex-shrink:0}
.backlinks{columns:2;column-gap:1.6rem}
.backlinks a{display:block;padding:.18rem 0;font-size:13.5px;break-inside:avoid}
@media(max-width:600px){.backlinks{columns:1}}

/* ── index tables & cards ── */
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.3rem 0 1.1rem}
.toolbar select,.toolbar input{background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:.4rem .6rem;font-size:13px;color:var(--ink)}
.count{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--inset);text-align:left;padding:.55rem .8rem;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap;position:sticky;top:0}
tbody td{padding:.5rem .8rem;border-top:1px solid var(--line2);vertical-align:top;color:var(--ink2)}
tbody tr:hover{background:var(--card)}
td .cat{font-size:11px;color:var(--muted)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.ecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;display:block;color:var(--ink)}
.ecard:hover{border-color:var(--accent);text-decoration:none}
.ecard .en{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:500;line-height:1.15}
.ecard .ed{font-size:12px;color:var(--muted);margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── timeline ── */
.tl{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);margin-left:.4rem;padding-left:0}
.tlrow{display:grid;grid-template-columns:96px 1fr;gap:.9rem;align-items:baseline;padding:.32rem 0 .32rem 1rem;position:relative}
.tlrow::before{content:"";position:absolute;left:-5px;top:.85rem;width:8px;height:8px;border-radius:50%;
  background:var(--eracol,var(--accent));border:2px solid var(--paper)}
.tlrow .yr{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.tlrow .who{font-size:14px}
.tlrow .pty{font-size:11px;color:var(--muted)}
.era-pirate{--eracol:var(--era-pirate)} .era-colonial{--eracol:var(--era-colonial)}
.era-independence{--eracol:var(--era-independence)} .era-modern{--eracol:var(--era-modern)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;margin:.2rem 0 1rem;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ── seasons ── */
.season{margin-bottom:1.6rem}
.season h3{font-family:'Fraunces',serif;font-size:1.15rem;text-transform:none;letter-spacing:0;
  color:var(--ink);font-weight:500;border-bottom:1px solid var(--line2);padding-bottom:.3rem;margin-bottom:.6rem}
.season h3 span{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-left:.5rem}
.pill-row{display:flex;flex-wrap:wrap;gap:.4rem}
.pill{display:inline-block;padding:.28rem .6rem;border-radius:20px;background:var(--card);
  border:1px solid var(--line);font-size:13px;color:var(--ink)}
.pill:hover{border-color:var(--accent);text-decoration:none}

/* ── overview hero ── */
.hero{border-bottom:1px solid var(--line);padding-bottom:1.6rem;margin-bottom:1.6rem}
.hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2.4rem,6vw,4.2rem);line-height:.98;
  letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--accent);font-weight:500}
.hero .sub{font-size:1.1rem;color:var(--ink2);margin-top:.7rem;max-width:60ch}
.statband{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin:1.4rem 0}
.landgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:8px;padding:.9rem 1.1rem;font-size:13.5px;color:var(--ink2);margin:1.4rem 0}
.note strong{color:var(--ink)}

/* ── edit form ── */
.editform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.3rem 1.4rem;max-width:720px}
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.3rem}
.field input,.field textarea,.field select{width:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:7px;padding:.55rem .7rem;font-size:14px;color:var(--ink);font-family:inherit}
.field textarea{min-height:110px;resize:vertical;line-height:1.55}
.field .hint{font-size:11px;color:var(--muted);margin-top:.25rem}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.btns{display:flex;gap:.6rem;margin-top:1.2rem;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;
  padding:.5rem .95rem;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none}
.btn.small{padding:.32rem .7rem;font-size:12px}
.editbtn{float:right;margin-top:.2rem}

/* history */
.rev{display:grid;grid-template-columns:120px 1fr;gap:.8rem;padding:.6rem 0;border-bottom:1px solid var(--line2);font-size:13px}
.rev .when{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}
.rev .fld{font-weight:600;color:var(--ink)}
.rev del{color:var(--danger);text-decoration:line-through;opacity:.8}
.rev ins{color:var(--good);text-decoration:none}

.empty{color:var(--muted);font-size:14px;padding:2rem 0}

/* person photo + relations editor */
.ib-photo{width:100%;display:block;aspect-ratio:4/5;object-fit:cover;background:var(--inset);border-bottom:1px solid var(--line)}
.ib-photo.empty-ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;aspect-ratio:4/5}
.photoedit{display:flex;gap:1rem;align-items:flex-start;margin-bottom:1rem}
.photoedit .pv{width:104px;height:130px;border-radius:8px;object-fit:cover;background:var(--inset);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;flex-shrink:0;overflow:hidden}
.photoedit .pv img{width:100%;height:100%;object-fit:cover}
.rel-editor{border:1px solid var(--line2);border-radius:9px;padding:.9rem;background:var(--paper)}
.rel-list{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.7rem}
.rel-item{display:flex;gap:.6rem;align-items:center;font-size:13px;background:var(--card);
  border:1px solid var(--line2);border-radius:7px;padding:.35rem .5rem .35rem .7rem}
.rel-item .rt{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.05em;min-width:88px}
.rel-item .rx{margin-left:auto;border:none;background:none;color:var(--danger);font-size:16px;line-height:1;padding:0 .3rem;cursor:pointer}
.rel-add{display:grid;grid-template-columns:130px 1fr auto;gap:.5rem;align-items:center}
.rel-add select,.rel-add input{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.4rem .55rem;font-size:13px;color:var(--ink)}
@media(max-width:560px){.rel-add{grid-template-columns:1fr}}
.relbox{display:flex;flex-direction:column;gap:.5rem}
.relbox .conn .rel{min-width:96px}
.redlink{color:var(--danger);border-bottom:1px dotted var(--danger);cursor:help;opacity:.85}
.extlink .ext{font-size:.75em;vertical-align:.15em;opacity:.7;margin-left:1px}
.extlink{color:var(--link);border-bottom:1px dotted color-mix(in srgb,var(--link) 55%,transparent)}
.backbtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);
  padding:.32rem .7rem;font-size:12.5px;margin-bottom:1rem}
.backbtn:hover{border-color:var(--accent);color:var(--ink)}
/* home: key pages */
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:.6rem;margin:.3rem 0 1rem}
.klink{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:.6rem .75rem;color:var(--ink)}
.klink:hover{border-color:var(--accent);text-decoration:none}
.klink .kt{display:flex;flex-direction:column;min-width:0}
.klink .kr{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.klink .kn{font-family:'Fraunces',serif;font-size:1.02rem;line-height:1.15;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seclinks-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem;margin-bottom:.4rem}
.seclink{display:flex;flex-direction:column;gap:.1rem;background:var(--bg-inset,var(--inset));border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:8px;padding:.6rem .8rem;color:var(--ink)}
.seclink:hover{text-decoration:none;filter:brightness(1.02);border-left-color:var(--accent-lt,var(--accent))}
.seclink .kn{font-weight:600;font-size:14px}
.seclink .kr{font-size:11.5px;color:var(--muted)}
.muted-sub{font-size:12.5px;color:var(--muted);margin:-.5rem 0 .8rem}
.chron{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:.3rem}
.cev{display:grid;grid-template-columns:70px 1fr;gap:.9rem;padding:.4rem 0 .4rem 1rem;position:relative;align-items:baseline}
.cev::before{content:"";position:absolute;left:-5px;top:.75rem;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.cev .cy{font-size:12.5px;color:var(--accent);white-space:nowrap;font-weight:500;padding-top:1px}
.cev .cy.approx{color:var(--muted)}
.cev .ct{color:var(--ink2);font-size:14px}
@media(max-width:560px){.cev{grid-template-columns:56px 1fr;gap:.5rem}}

/* avatars / thumbnails */
.avatar{border-radius:50%;object-fit:cover;background:var(--inset);display:inline-flex;
  align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle;border:1px solid var(--line2)}
.avatar.ph{color:var(--muted);font-weight:600;letter-spacing:.02em}
.ecard.person .pcard-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.35rem}
.ecard.person .pcard-top .en{margin:0}
td .avatar{margin:0}

/* index toolbar: view toggle + column menu */
.idxbar{gap:.45rem}
.idxbar select,.idxbar input{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:.4rem .55rem;font-size:12.5px;color:var(--ink)}
.ckbox{display:inline-flex;align-items:center;gap:.35rem;font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:.35rem .55rem;background:var(--card)}
.viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.viewtoggle button{background:var(--card);border:none;color:var(--muted);padding:.35rem .55rem;font-size:14px;line-height:1}
.viewtoggle button+button{border-left:1px solid var(--line)}
.viewtoggle button.on{background:var(--accent);color:#fff}
.colmenu-wrap{position:relative}
.colmenu{position:absolute;top:calc(100% + 4px);right:0;background:var(--card);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:.4rem;min-width:170px;z-index:30;display:none}
.colmenu.open{display:block}
.colmenu .ckrow{display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--ink2);padding:.32rem .45rem;border-radius:6px;cursor:pointer}
.colmenu .ckrow:hover{background:var(--inset)}
/* bulk editing */
.bcell{width:100%;min-width:80px;background:var(--paper);border:1px solid var(--line);border-radius:5px;
  padding:.25rem .4rem;font-size:12.5px;color:var(--ink);font-family:inherit}
.bcell:focus{outline:none;border-color:var(--accent)}
.bcell.dirty{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,var(--paper))}
table.bulk td{padding:.28rem .4rem;vertical-align:middle}
.bulkbar{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);z-index:70;display:flex;align-items:center;
  gap:.75rem;background:var(--card);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 12px 34px rgba(0,0,0,.24);padding:.55rem .7rem .55rem 1rem;font-size:13px}
.bulkbar[hidden]{display:none}
.bulkbar #bulkcount{color:var(--ink2);font-variant-numeric:tabular-nums;font-weight:500}
/* link editor context menu */
.linkmenu{position:fixed;z-index:90;min-width:236px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:.35rem;font-size:13px}
.linkmenu .lm-head{font-size:11px;color:var(--muted);padding:.35rem .5rem .3rem;text-transform:uppercase;letter-spacing:.05em}
.linkmenu .lm-opt{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
  padding:.5rem .55rem;border-radius:7px;font-size:13px}
.linkmenu .lm-opt:hover{background:var(--inset)}
.linkmenu .lm-back{color:var(--muted);font-size:12px}
.linkmenu input{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:7px;
  padding:.4rem .55rem;font-size:13px;color:var(--ink);margin:.15rem 0 .35rem}
.linkmenu .lm-results{max-height:210px;overflow-y:auto}
.linkmenu .lm-res{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;width:100%;
  background:none;border:none;color:var(--ink);padding:.42rem .55rem;border-radius:7px;text-align:left}
.linkmenu .lm-res:hover{background:var(--inset)}
.linkmenu .lm-res .lm-t{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.linkmenu .lm-empty{color:var(--muted);font-size:12px;padding:.4rem .55rem}

/* collapsible sidebar */
.sbcollapse{position:absolute;top:.7rem;right:.7rem;background:none;border:1px solid var(--line);
  border-radius:6px;color:var(--muted);width:24px;height:24px;line-height:1;font-size:13px;padding:0}
.sbcollapse:hover{color:var(--ink);border-color:var(--accent)}
.sidebar{position:sticky} /* base already sticky; ensure relative context for the button */
.sbexpand{display:none;position:fixed;top:.8rem;left:.8rem;z-index:60;background:var(--card);
  border:1px solid var(--line);border-radius:8px;color:var(--ink2);width:32px;height:32px;font-size:15px;line-height:1}
.sbexpand:hover{border-color:var(--accent);color:var(--ink)}
body.sbc .shell{grid-template-columns:minmax(0,1fr)}
body.sbc .sidebar{display:none}
@media (min-width:881px){ body.sbc .sbexpand{display:inline-flex;align-items:center;justify-content:center} }
@media (max-width:880px){ .sbcollapse{display:none} .sbexpand{display:none!important} body.sbc .shell{grid-template-columns:1fr} body.sbc .sidebar{display:flex} }

/* ── responsive ── */
.menubtn{display:none}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .22s}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .main{padding-top:3.6rem}
  .article{grid-template-columns:1fr}
  .infobox{position:static;order:-1;margin-bottom:1.4rem}
  .menubtn{display:inline-flex;position:fixed;top:.7rem;left:.7rem;z-index:60;background:var(--card);
    border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem;font-size:13px;color:var(--ink);align-items:center;gap:.4rem}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .scrim.open{display:block}
}

<script id="wikidata" type="application/json">__WIKI_DATA__</script>
<script id="appcode">
"use strict";
(function(){
const FONTS="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Spline+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap";

// ── state ──────────────────────────────────────────────────────────────
let DATA = JSON.parse(document.getElementById('wikidata').textContent);
let CAP = null;         // artifact capability (writer) or null
let WRITER = false;
let LOCAL = false;      // saving to localStorage only
const LSKEY='amparacan_wiki_v1';

// prefer a locally-saved copy only when we can't publish shared
function bootState(){
  try{
    const ls=localStorage.getItem(LSKEY);
    if(ls){ const j=JSON.parse(ls); if(j&&j.__local){ DATA=j.data; LOCAL=true; } }
  }catch(e){}
}
bootState();

// indexes
let BY={}, RELS_A={}, RELS_B={}, BY_NAME={};
const NAME_PRIO={person:0,place:1,political_party:2,organisation:3,street:4};
function reindex(){
  BY={}; RELS_A={}; RELS_B={}; BY_NAME={};
  DATA.entities.forEach(e=>BY[e.slug]=e);
  // name -> slug for [[wiki-links]]; when a name is shared, prefer person>place>party>street
  DATA.entities.slice().sort((a,b)=>(NAME_PRIO[a.type]||9)-(NAME_PRIO[b.type]||9)).forEach(e=>{
    const k=e.name.toLowerCase(); if(!(k in BY_NAME))BY_NAME[k]=e.slug;
  });
  (DATA.relationships||[]).forEach((r,i)=>{
    (RELS_A[r.a]=RELS_A[r.a]||[]).push(r);
    (RELS_B[r.b]=RELS_B[r.b]||[]).push(r);
  });
}
reindex();
DATA.revisions=DATA.revisions||[];
DATA.chronology=DATA.chronology||[];

const TYPE_LABEL={person:'Person',place:'Place',street:'Street',political_party:'Political party',organisation:'Organisation'};
const TYPE_PLURAL={person:'People',place:'Places',street:'Streets',political_party:'Political parties',organisation:'Organisations'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// real-world topics → Wikipedia (auto-linked inside free text)
const WIKI_EXT={
 "Viceroyalty of New Spain":"Viceroyalty_of_New_Spain","Captaincy General of Yucatán":"Captaincy_General_of_Yucat%C3%A1n",
 "First Mexican Empire":"First_Mexican_Empire","Empire of Mexico":"First_Mexican_Empire","Spanish Empire":"Spanish_Empire",
 "New Spain":"New_Spain","Classic Maya Collapse":"Classic_Maya_collapse","Classic Maya collapse":"Classic_Maya_collapse",
 "Hernán Cortés":"Hern%C3%A1n_Cort%C3%A9s","Pánfilo de Narváez":"P%C3%A1nfilo_de_Narv%C3%A1ez",
 "Juan de Grijalva":"Juan_de_Grijalva","Francisco de Montejo":"Francisco_de_Montejo","Benito Juárez":"Benito_Ju%C3%A1rez",
 "Andrés Quintana Roo":"Andr%C3%A9s_Quintana_Roo","Gulf of Honduras":"Gulf_of_Honduras","Gulf of Batabanó":"Gulf_of_Bataban%C3%B3",
 "Santo Domingo":"Santo_Domingo","Xaman-Ek":"Xaman_Ek","Xaman Ek":"Xaman_Ek","Ix Chel":"Ixchel","Quiriguá":"Quirigu%C3%A1",
 "Cozumel":"Cozumel","Cobá":"Coba","Ekab":"Ekab","Yucatán":"Yucat%C3%A1n_Peninsula","Tenerife":"Tenerife","Havana":"Havana",
 "Maroon":"Maroon_(people)","Taíno":"Ta%C3%ADno","Taino":"Ta%C3%ADno","Maya":"Maya_civilization",
 "New Spain's":"New_Spain","Cuba":"Cuba","Mexico":"Mexico","Spain":"Spain","Acapulco":"Acapulco","Alexandria":"Alexandria",
};
const WIKI_TERMS=Object.keys(WIKI_EXT).sort((a,b)=>b.length-a.length);
// esc plain text and auto-link known real-world terms (first hit of each term)
function linkifyExternal(text){
  const claimed=new Array(text.length).fill(false); const spans=[];
  for(const term of WIKI_TERMS){
    const i=text.indexOf(term); if(i<0)continue; const j=i+term.length;
    if(i>0&&/[A-Za-zÀ-ÿ0-9]/.test(text[i-1]))continue;
    if(j<text.length&&/[A-Za-zÀ-ÿ0-9]/.test(text[j]))continue;
    let clash=false; for(let k=i;k<j;k++)if(claimed[k]){clash=true;break;}
    if(clash)continue; for(let k=i;k<j;k++)claimed[k]=true;
    spans.push([i,j,term]);
  }
  if(!spans.length)return esc(text);
  spans.sort((a,b)=>a[0]-b[0]); let out='',pos=0;
  for(const[i,j,term]of spans){ out+=esc(text.slice(pos,i))+extLink('https://en.wikipedia.org/wiki/'+WIKI_EXT[term],text.slice(i,j)); pos=j; }
  return out+esc(text.slice(pos));
}
function extLink(url,label){return `<a class="extlink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}<span class="ext">↗</span></a>`;}
// render free text: [[Name]]/[[Name|label]] → article links; [label](url) →
// free-form external links; known real-world terms → Wikipedia
function wikitext(str){
  if(str==null||str==='')return '';
  return String(str).split(/(\[\[[^\]]+\]\]|\[[^\]\[]+\]\((?:https?:\/\/|mailto:)[^)\s]+\))/g).map(seg=>{
    let m=seg.match(/^\[\[([^\]]+)\]\]$/);
    if(m){
      let inner=m[1],pipe=inner.indexOf('|');
      let target=(pipe>=0?inner.slice(0,pipe):inner).trim();
      let label=(pipe>=0?inner.slice(pipe+1):inner).trim();
      const slug=BY_NAME[target.toLowerCase()];
      if(slug)return `<a href="#/e/${slug}">${esc(label)}</a>`;
      return `<span class="redlink" title="No article named “${esc(target)}” yet">${esc(label)}</span>`;
    }
    m=seg.match(/^\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)$/);
    if(m)return extLink(m[2],m[1]);
    return linkifyExternal(seg);
  }).join('');
}
const fmt=n=>n==null||n===''?'':Number(n).toLocaleString('en-US');

function link(slug,label){const e=BY[slug];if(!e)return esc(label||slug);
  return `<a href="#/e/${encodeURIComponent(slug)}">${esc(label||e.name)}</a>`;}

// ── routing ────────────────────────────────────────────────────────────
function parseHash(){
  const h=location.hash.replace(/^#\/?/,'');
  const [path,qs]=h.split('?');
  const parts=path.split('/').filter(Boolean);
  const params=new URLSearchParams(qs||'');
  return {parts,params};
}
function go(hash){location.hash=hash;}
let NAV_DEPTH=0, _backing=false;
window.addEventListener('hashchange',()=>{
  if(_backing){_backing=false;NAV_DEPTH=Math.max(0,NAV_DEPTH-1);}else{NAV_DEPTH++;}
  route();
});

function route(){
  const {parts,params}=parseHash();
  const view=document.getElementById('view');
  view.scrollTop=0; window.scrollTo(0,0);
  closeMenu();
  let html='';
  if(parts.length===0){ html=pageOverview(); }
  else if(parts[0]==='e'){ html=pageEntity(decodeURIComponent(parts[1]||''),params); }
  else if(parts[0]==='edit'){ html=pageEdit(decodeURIComponent(parts[1]||'')); }
  else if(parts[0]==='history'){ html=pageHistory(decodeURIComponent(parts[1]||'')); }
  else if(parts[0]==='type'){ html=pageType(parts[1]); }
  else if(parts[0]==='streets'){ html=pageType('street'); }
  else if(parts[0]==='timeline'){ html=pageTimeline(); }
  else if(parts[0]==='chronology'){ html=pageChronology(); }
  else if(parts[0]==='seasons'){ html=pageSeasons(); }
  else if(parts[0]==='random'){ const e=DATA.entities[Math.floor(Math.random()*DATA.entities.length)]; go('#/e/'+encodeURIComponent(e.slug)); return; }
  else html=`<div class="empty">Page not found. <a href="#/">Return to the overview.</a></div>`;
  if(parts.length){ html=`<button class="backbtn" id="backbtn" type="button">← Back</button>`+html; }
  view.innerHTML=html;
  const bb=document.getElementById('backbtn'); if(bb)bb.onclick=goBack;
  renderNav();
  wirePage();
  view.focus({preventScroll:true});
}
function goBack(){ if(NAV_DEPTH>0){_backing=true;history.back();} else go('#/'); }

// ── nav / sidebar ──────────────────────────────────────────────────────
function counts(){const c={person:0,place:0,street:0,political_party:0};DATA.entities.forEach(e=>c[e.type]=(c[e.type]||0)+1);return c;}
function renderNav(){
  const c=counts(); const h=location.hash;
  const cur=(frag)=>h.startsWith(frag)?'active':'';
  const items=[
    ['#/','Home',''],
    ['#/type/person','People',c.person],
    ['#/streets','Streets',c.street],
    ['#/type/place','Places',c.place],
    ['#/type/political_party','Parties',c.political_party],
  ];
  const items2=[
    ['#/chronology','Chronology',(DATA.chronology||[]).length],
    ['#/timeline','Heads of state',DATA.heads_of_state.length],
    ['#/seasons','Seasons','11'],
    ['#/random','Random article',''],
  ];
  const row=([href,label,ct])=>`<a href="${href}" class="${href==='#/'?(h===''||h==='#/'?'active':''):(h.startsWith(href)?'active':'')}">${esc(label)}${ct!==''?`<span class="ct">${ct}</span>`:''}</a>`;
  document.getElementById('nav').innerHTML=
    `<div class="navlabel">Browse</div>`+items.map(row).join('')+
    `<div class="navlabel">Discover</div>`+items2.map(row).join('');
  // footer status
  const mode = WRITER ? `<span class="statuschip" id="status">Edits shared</span>`
    : LOCAL||!CAP ? `<span class="statuschip" id="status">Edits saved on this device</span>`
    : `<span class="statuschip" id="status">Read-only</span>`;
  document.getElementById('sbfoot').innerHTML=
    `${mode}<div style="margin-top:.6rem">${DATA.entities.length} articles · ${(DATA.relationships||[]).length} links</div>`+
    `<button id="themebtn" type="button">◑ Toggle theme</button>`;
}

// ── OVERVIEW ───────────────────────────────────────────────────────────
function pageOverview(){
  const c=counts();
  const streets=DATA.entities.filter(e=>e.type==='street').length;
  const neigh=DATA.entities.filter(e=>e.place_type==='neighbourhood').length;
  const hos=DATA.heads_of_state;
  const current=hos.filter(h=>h.term).slice(-1)[0]||hos.slice(-1)[0];
  const founder=BY['alejandro-vazquez-merayo'];
  const bigNeigh=DATA.entities.filter(e=>e.place_type==='neighbourhood'&&e.population)
    .sort((a,b)=>b.population-a.population)[0];
  const rndStreet=DATA.entities.filter(e=>e.type==='street'&&e.meaning)[Math.floor(Math.random()*80)];
  const stat=(k,v)=>`<div class="fact"><div class="k">${k}</div><div class="v ${String(v).length>6?'sm':''}">${v}</div></div>`;
  const feat=(label,e,extra)=>e?`<a class="ecard" href="#/e/${e.slug}"><div class="eyebrow">${label}</div><div class="en">${esc(e.name)}</div><div class="ed">${esc(extra||e.description||'')}</div></a>`:'';
  // curated direct links to the most important articles (skipped if missing)
  const keySpec=[
    ['Founder','alejandro-vazquez-merayo'],
    ['Head of state',current&&current.person],
    ['Capital province','isla-capital'],
    ['Old town','pueblo-viejo'],
    ['City centre','centro'],
    ['Governing party','partido-laboral-progresista'],
    ['Opposition','alianza-republicana'],
    ['Independence','teseo-dominguez-de-mora'],
    ['Longest-serving','osvaldo-rosero-valencia'],
    ['Modern politics','estefania-luna'],
  ];
  const keyTiles=keySpec.filter(([l,s])=>s&&BY[s]).map(([l,s])=>
    `<a class="klink" href="#/e/${s}">${BY[s].photo?avatarImg(BY[s],34):''}<span class="kt"><span class="kr">${esc(l)}</span><span class="kn">${esc(BY[s].name)}</span></span></a>`).join('');
  const secLinks=[['#/chronology','Chronology','the full 752–1951 timeline'],['#/timeline','Heads of state','every ruler since 1658'],['#/seasons','Seasons','the eleven narrative eras'],['#/streets','Streets','all '+streets+' named streets']]
    .map(([h,n,d])=>`<a class="seclink" href="${h}"><span class="kn">${n}</span><span class="kr">${d}</span></a>`).join('');
  return `
  <section class="hero">
    <div class="eyebrow">Island city-state · Caribbean</div>
    <h1>Ampara<em>cán</em></h1>
    <p class="sub">A living reference to a fictional island city-state — from its 1650s beginnings as a smugglers' haven, through Spanish rule and independence, to a democratic metropolis of the 2060s.</p>
    <div class="statband">
      ${stat('People',c.person)}
      ${stat('Streets',streets)}
      ${stat('Neighbourhoods',neigh)}
      ${stat('Political parties',c.political_party)}
      ${stat('Heads of state',hos.length)}
      ${stat('Years chronicled','~410')}
    </div>
  </section>
  <h2 class="sec">Key pages</h2>
  <div class="keygrid">${keyTiles}</div>
  <div class="seclinks-row">${secLinks}</div>
  <div class="note"><strong>This wiki is editable.</strong> Every fact lives once as a record; each page is rendered from those records, so an edit to any entry updates every page that references it. Open any article and use <em>Edit</em> — ${WRITER?'your changes are shared with everyone who opens this page.':LOCAL||!CAP?'your changes are saved on this device.':'changes are saved for editors of this artifact.'}</div>
  <h2 class="sec">Start here</h2>
  <div class="landgrid">
    ${feat('Founding figure',founder,founder&&founder.description)}
    ${feat('Head of state',current&&BY[current.person],current?`Served ${current.start}–${current.end}${current.party&&BY[current.party]?' · '+BY[current.party].name:''}`:'')}
    ${feat('Largest neighbourhood',bigNeigh,bigNeigh&&('Population '+fmt(bigNeigh.population)))}
    ${feat('A street',rndStreet,rndStreet&&('Named for: '+rndStreet.meaning))}
  </div>
  <h2 class="sec">Browse the archive</h2>
  <div class="cardgrid">
    <a class="ecard" href="#/type/person"><div class="en">People</div><div class="ed">${c.person} figures across eleven narrative seasons — pirates, governors, poets, presidents.</div></a>
    <a class="ecard" href="#/streets"><div class="en">Streets</div><div class="ed">${streets} named streets, cross-referenced to neighbourhoods and the people they honour.</div></a>
    <a class="ecard" href="#/type/place"><div class="en">Places</div><div class="ed">Provinces, city neighbourhoods and outer-island settlements.</div></a>
    <a class="ecard" href="#/type/political_party"><div class="en">Parties</div><div class="ed">${c.political_party} political parties, active and defunct, with vote and seat records.</div></a>
    <a class="ecard" href="#/timeline"><div class="en">Heads of state</div><div class="ed">Every leader from 1658 to 2046, along a timeline coloured by era.</div></a>
    <a class="ecard" href="#/seasons"><div class="en">Seasons</div><div class="ed">The eleven narrative eras that structure the world, each with its cast.</div></a>
  </div>`;
}

// ── ENTITY PAGE ────────────────────────────────────────────────────────
function relsOf(slug){
  const out=[];
  (RELS_A[slug]||[]).forEach(r=>out.push({dir:'out',rel:r.type,other:r.b,desc:r.description}));
  (RELS_B[slug]||[]).forEach(r=>out.push({dir:'in',rel:invRel(r.type),other:r.a,desc:r.description}));
  return out;
}
const REL_INV={'runs through':'streets here','located in':'contains','named after':'namesake of','member of party':'members',
  'parent of':'child of','child of':'parent of','sibling of':'sibling of','spouse of':'spouse of','relative of':'relative of',
  'mentor of':'student of','student of':'mentor of','ally of':'ally of','rival of':'rival of','associate of':'associate of',
  'successor of':'predecessor of','predecessor of':'successor of'};
function invRel(t){return REL_INV[t]||t;}
// personal relationship types (both directions) — shown in a dedicated Relations panel
const PERSON_RELS=['parent of','child of','sibling of','spouse of','relative of','mentor of','student of','ally of','rival of','associate of','successor of','predecessor of'];
// types offered in the editor (a person "owns" these on their own page; inverses appear on the other page)
const PERSON_REL_OPTS=['parent of','child of','sibling of','spouse of','relative of','mentor of','ally of','rival of','associate of','successor of'];

function pageEntity(slug,params){
  const e=BY[slug];
  if(!e)return `<div class="empty">No article for “${esc(slug)}”. <a href="#/">Overview</a></div>`;
  const rels=relsOf(slug);
  const info=infobox(e,rels);
  let body=`<div class="artbody">
    <div class="crumbs"><a href="#/type/${e.type}">${esc(TYPE_PLURAL[e.type]||e.type)}</a><span class="sep">›</span><span>${esc(e.name)}</span></div>
    <div class="eyebrow">${esc(subtitleFor(e))}</div>
    <h1 class="title">${esc(e.name)}</h1>
    ${WRITER||LOCAL||CAP?`<button class="btn small editbtn" onclick="location.hash='#/edit/${e.slug}'">✎ Edit</button>`:''}
    <p class="lead">${wikitext(e.description)||'No description yet.'}</p>`;
  if(e.bio){body+=`<h2 class="sec">${e.type==='person'?'Biography':'Overview'}</h2>`+
    e.bio.split(/\n\s*\n/).map(para=>`<p>${wikitext(para)}</p>`).join('');}
  body+=typeSections(e,rels);
  // chronology events mentioning this entity
  const evs=entityEvents(slug);
  if(evs.length){
    body+=`<h2 class="sec">In the chronology <span class="count">${evs.length}</span></h2><div class="chron">`+
      evs.map(ev=>`<div class="cev"><span class="cy mono${ev.approx?' approx':''}">${esc(ev.label)}</span><span class="ct">${wikitext(ev.text)}</span></div>`).join('')+
      `</div>`;
  }
  // connections (personal relations are shown separately for people)
  const shown=rels.filter(r=>BY[r.other]&&!(e.type==='person'&&PERSON_RELS.includes(r.rel)));
  if(shown.length){
    body+=`<h2 class="sec">Connections</h2><div class="conns">`+
      shown.slice(0,40).map(r=>`<div class="conn"><span class="rel">${esc(r.rel)}</span><span>${link(r.other)}${r.desc?` <span class="cat">— ${esc(r.desc)}</span>`:''}</span></div>`).join('')+
      `</div>`;
  }
  // what links here
  const back=(RELS_B[slug]||[]).map(r=>r.a).filter((v,i,a)=>a.indexOf(v)===i&&BY[v]);
  if(back.length){
    body+=`<h2 class="sec">What links here <span class="count">${back.length}</span></h2>
      <div class="backlinks">`+back.slice(0,200).map(s=>link(s)).join('')+`</div>`;
  }
  body+=`<div style="margin-top:2rem"><a class="btn small ghost" href="#/history/${e.slug}">◷ View history</a></div>`;
  body+=`</div>`;
  return `<div class="article">${body}${info}</div>`;
}

function subtitleFor(e){
  if(e.type==='person'){const ss=e.seasons&&e.seasons.length?`Season ${e.seasons.join(', ')}`:'';return [e.occupation,ss].filter(Boolean).join(' · ')||'Person';}
  if(e.type==='street')return (e.street_type||'Street')+(e.category?' · '+e.category:'');
  if(e.type==='place')return (e.place_type?cap1(e.place_type):'Place');
  if(e.type==='political_party')return 'Political party'+(e.abbreviation?' · '+e.abbreviation:'');
  return TYPE_LABEL[e.type]||'Article';
}
function cap1(s){return s?s[0].toUpperCase()+s.slice(1):s;}

function infobox(e,rels){
  let rows='';
  const R=(k,v)=>{if(v!=null&&v!=='')rows+=`<div class="row"><dt>${esc(k)}</dt><dd>${v}</dd></div>`;};
  let photo=e.photo?`<img class="ib-photo" src="${e.photo}" alt="Image of ${esc(e.name)}">`:'';
  if(e.type==='person'){
    const life=[e.birth_year,e.death_year].some(x=>x!=null)?`${e.birth_year!=null?e.birth_year:'?'}–${e.death_year!=null?e.death_year:(e.birth_year!=null?'present':'?')}`:'';
    R('Born',life);
    R('Birthplace',e.origin_city?esc(e.origin_city):(e.origin==='foreign'?'Foreign':''));
    R('Occupation',e.occupation?esc(e.occupation):'');
    R('Education',e.education?esc(e.education):'');
    R('Party',e.party&&BY[e.party]?link(e.party):(e.party?esc(e.party):''));
    R('Role',e.political_role?esc(e.political_role):'');
    R('Notable for',e.notable_for?esc(e.notable_for):'');
    R('Seasons',e.seasons&&e.seasons.length?`<div class="chips">${e.seasons.map(s=>`<a class="chip accent" href="#/seasons">${s}</a>`).join('')}</div>`:'');
    const terms=DATA.heads_of_state.filter(h=>h.person===e.slug);
    if(terms.length)R('In office',terms.map(t=>`${t.start}–${t.end}`).join(', '));
  }else if(e.type==='street'){
    R('Type',esc(e.street_type));R('Category',esc(e.category));
    R('Meaning',e.meaning?`<span class="mono">${esc(e.meaning)}</span>`:'');
    R('Note',e.note?esc(e.note):'');
  }else if(e.type==='place'){
    R('Kind',e.place_type?cap1(e.place_type):'');
    R('Population',e.population?fmt(e.population):'');
    R('Founded',e.founded_decade);R('Grew fastest',e.peak_decade);
    R('Typology',e.typology);R('Province type',e.province_of);
    if(e.districts)R('Districts',e.districts);
    if(e.parent&&BY[e.parent])R('Within',link(e.parent));
  }else if(e.type==='political_party'){
    R('Abbrev.',e.abbreviation?`<span class="mono">${esc(e.abbreviation)}</span>`:'');
    R('Alignment',esc(e.alignment));R('Ideology',esc(e.ideology));
    R('Seats',e.seats!=null?e.seats:'');R('Vote',e.vote_pct!=null?e.vote_pct+'%':'');
    R('Votes',e.constituency?fmt(e.constituency):'');R('Founded',e.year_est);R('Status',esc(e.status));
  }
  if(e.wikipedia)R('Wikipedia',extLink(e.wikipedia,'View on Wikipedia'));
  return `<aside class="infobox">${photo}<div class="ib-head"><div class="ib-type">${esc(TYPE_LABEL[e.type]||e.type)}</div>
    <div class="ib-name">${esc(e.name)}</div></div><dl>${rows||'<div class="row"><dd style="color:var(--muted)">No structured facts yet.</dd></div>'}</dl></aside>`;
}

function typeSections(e,rels){
  let h='';
  if(e.type==='place'){
    const kids=(RELS_B[e.slug]||[]).filter(r=>r.type==='located in').map(r=>r.a).filter(s=>BY[s]);
    if(kids.length){h+=`<h2 class="sec">Within ${esc(e.name)} <span class="count">${kids.length}</span></h2><div class="pill-row">`+kids.map(s=>`<a class="pill" href="#/e/${s}">${esc(BY[s].name)}</a>`).join('')+`</div>`;}
    const streets=(RELS_B[e.slug]||[]).filter(r=>r.type==='runs through').map(r=>r.a).filter(s=>BY[s]);
    if(streets.length){h+=`<h2 class="sec">Streets in ${esc(e.name)} <span class="count">${streets.length}</span></h2><div class="pill-row">`+streets.map(s=>`<a class="pill" href="#/e/${s}">${esc(BY[s].name)}</a>`).join('')+`</div>`;}
  }
  if(e.type==='political_party'){
    const mem=(RELS_B[e.slug]||[]).filter(r=>r.type==='member of party').map(r=>({s:r.a,d:r.description})).filter(x=>BY[x.s]);
    if(mem.length){h+=`<h2 class="sec">Heads of state <span class="count">${mem.length}</span></h2><div class="conns">`+mem.map(x=>`<div class="conn"><span class="rel">${esc(x.d||'')}</span><span>${link(x.s)}</span></div>`).join('')+`</div>`;}
  }
  if(e.type==='person'){
    const prs=relsOf(e.slug).filter(r=>PERSON_RELS.includes(r.rel)&&BY[r.other]&&BY[r.other].type==='person');
    if(prs.length){h+=`<h2 class="sec">Relations <span class="count">${prs.length}</span></h2><div class="relbox">`+
      prs.map(r=>`<div class="conn"><span class="rel">${esc(r.rel)}</span><span>${link(r.other)}${r.desc?` <span class="cat">— ${esc(r.desc)}</span>`:''}</span></div>`).join('')+`</div>`;}
    const terms=DATA.heads_of_state.filter(h=>h.person===e.slug).sort((a,b)=>a.start-b.start);
    if(terms.length){h+=`<h2 class="sec">Terms in office</h2><div class="conns">`+terms.map(t=>`<div class="conn"><span class="rel mono">${t.start}–${t.end}</span><span>${t.term?'Term '+t.term+' · ':''}${t.occupation?esc(t.occupation):''}${t.party&&BY[t.party]?' · '+link(t.party):''}${t.notes?` <span class="cat">— ${esc(t.notes)}</span>`:''}</span></div>`).join('')+`</div>`;}
    const named=(RELS_B[e.slug]||[]).filter(r=>r.type==='named after').map(r=>r.a).filter(s=>BY[s]);
    if(named.length){h+=`<h2 class="sec">Streets named after ${esc(e.name)} <span class="count">${named.length}</span></h2><div class="pill-row">`+named.map(s=>`<a class="pill" href="#/e/${s}">${esc(BY[s].name)}</a>`).join('')+`</div>`;}
  }
  return h;
}

function loadIdxPref(type){
  const cfg=INDEX_CFG[type]; let p={};
  try{p=JSON.parse(localStorage.getItem('amparacan_idx_'+type)||'{}');}catch(e){}
  const cols={}; cfg.columns.forEach(c=>{if(!c.pinned)cols[c.key]=(p.cols&&c.key in p.cols)?!!p.cols[c.key]:!!c.def;});
  const view=(p.view==='list'||p.view==='cards')?p.view:(cfg.defaultView||'cards');
  return {view,cols};
}
function saveIdxPref(type,pref){try{localStorage.setItem('amparacan_idx_'+type,JSON.stringify(pref));}catch(e){}}

function filterControl(f){
  if(f.kind==='text')return `<input id="flt_${f.key}" placeholder="${esc(f.label)}" autocomplete="off" style="min-width:170px">`;
  if(f.kind==='bool')return `<label class="ckbox"><input type="checkbox" id="flt_${f.key}"> ${esc(f.label)}</label>`;
  const opts=(f.opts?f.opts():[]);
  return `<select id="flt_${f.key}"><option value="">${esc(f.label)}: all</option>${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`;
}
function pageType(type){

// bulk editing state
let BULK_MODE=false, BULK={};
function bulkCount(){let n=0;for(const s in BULK)n+=Object.keys(BULK[s]).length;return n;}
function updateBulkBar(){const bar=document.getElementById('bulkbar');if(!bar)return;
  const n=bulkCount(); bar.hidden=!BULK_MODE;
  const c=document.getElementById('bulkcount'); if(c)c.textContent=n+' change'+(n===1?'':'s')+' staged';
  const s=document.getElementById('bulksave'); if(s)s.disabled=!n;}
function bulkCell(c,e){
  const staged=BULK[e.slug]&&c.field in BULK[e.slug];
  const cur=staged?BULK[e.slug][c.field]:(e[c.field]==null?'':e[c.field]);
  if(c.ekind==='select')return `<select class="bcell${staged?' dirty':''}" data-slug="${e.slug}" data-field="${c.field}">`+
    c.opts().map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(cur)?'selected':''}>${esc(o[1])}</option>`).join('')+`</select>`;
  return `<input class="bcell${staged?' dirty':''}" data-slug="${e.slug}" data-field="${c.field}" type="${c.ekind==='number'?'number':'text'}" value="${esc(cur)}">`;
}
function renderIndexBody(type){
  const cfg=INDEX_CFG[type]; const pref=loadIdxPref(type);
  let list=DATA.entities.filter(e=>e.type===type);
  cfg.filters.forEach(f=>{const el=document.getElementById('flt_'+f.key);if(!el)return;
    const v=f.kind==='bool'?el.checked:el.value; list=list.filter(e=>f.test(e,v));});
  list.sort(cfg.sort||((a,b)=>a.name.localeCompare(b.name)));
  const cnt=document.getElementById('idxcount'); if(cnt)cnt.textContent=list.length;
  const body=document.getElementById('idxbody'); if(!body)return;
  const listView = pref.view==='list' || BULK_MODE;   // bulk always uses the table
  if(!list.length){body.innerHTML=`<div class="empty">No matches. Adjust the filters.</div>`;return;}
  if(listView){
    const cols=cfg.columns.filter(c=>c.pinned||pref.cols[c.key]);
    body.innerHTML=`<div class="tablewrap"><table class="${BULK_MODE?'bulk':''}"><thead><tr>${cols.map(c=>`<th>${esc(c.label||'')}${BULK_MODE&&c.field?' ✎':''}</th>`).join('')}</tr></thead><tbody>`+
      list.map(e=>`<tr>${cols.map(c=>`<td>${(BULK_MODE&&c.field)?bulkCell(c,e):c.cell(e)}</td>`).join('')}</tr>`).join('')+`</tbody></table></div>`;
  }else body.innerHTML=`<div class="cardgrid">`+list.map(cfg.card).join('')+`</div>`;
}
function stageBulk(el){
  const slug=el.dataset.slug, field=el.dataset.field, e=BY[slug]; if(!e)return;
  let val=el.value; const orig=e[field]==null?'':String(e[field]);
  BULK[slug]=BULK[slug]||{};
  if(String(val)===orig){ delete BULK[slug][field]; if(!Object.keys(BULK[slug]).length)delete BULK[slug]; el.classList.remove('dirty'); }
  else { BULK[slug][field]=val; el.classList.add('dirty'); }
  updateBulkBar();
}
function applyBulk(){
  const now=new Date().toISOString(); let n=0;
  const NUM=['birth_year','death_year','population','seats','vote_pct','year_est'];
  for(const slug in BULK){const e=BY[slug];if(!e)continue;
    for(const field in BULK[slug]){
      let nv=BULK[slug][field]; const ov=e[field]==null?'':e[field];
      if(NUM.includes(field)) nv=(nv===''||nv==null)?null:Number(nv);
      const cmp=nv==null?'':nv;
      if(String(cmp)===String(ov))continue;
      DATA.revisions.push({entity:slug,field,old:String(ov),new:String(cmp),at:now});
      if(nv===''||nv==null)delete e[field]; else e[field]=nv; n++;
    }
  }
  BULK={}; BULK_MODE=false; reindex();
  persist(); route();   // persist publishes/saves; route re-renders the clean index
}
function wireIndex(){
  const body=document.getElementById('idxbody'); if(!body)return;
  const type=body.dataset.type; const cfg=INDEX_CFG[type]; if(!cfg)return;
  BULK_MODE=false; BULK={};   // fresh each navigation
  cfg.filters.forEach(f=>{const el=document.getElementById('flt_'+f.key);if(el)el.addEventListener(f.kind==='text'?'input':'change',()=>renderIndexBody(type));});
  document.querySelectorAll('#viewtoggle button').forEach(b=>b.onclick=()=>{
    if(BULK_MODE)return; const pref=loadIdxPref(type); pref.view=b.dataset.v; saveIdxPref(type,pref);
    document.querySelectorAll('#viewtoggle button').forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('colwrap').style.display=pref.view==='list'?'':'none';
    renderIndexBody(type);});
  const colbtn=document.getElementById('colbtn');
  if(colbtn){colbtn.onclick=e=>{e.stopPropagation();document.getElementById('colmenu').classList.toggle('open');};
    document.querySelectorAll('#colmenu input').forEach(cb=>cb.onchange=()=>{
      const pref=loadIdxPref(type); pref.cols[cb.dataset.col]=cb.checked; saveIdxPref(type,pref); renderIndexBody(type);});
  }
  // bulk editing
  const bulkbtn=document.getElementById('bulkbtn');
  if(bulkbtn)bulkbtn.onclick=()=>{ BULK_MODE=true; BULK={};
    document.getElementById('bulkbtn').style.display='none';
    document.getElementById('colwrap').style.display='none';
    renderIndexBody(type); updateBulkBar(); };
  body.addEventListener('input',e=>{const el=e.target.closest('.bcell');if(el)stageBulk(el);});
  body.addEventListener('change',e=>{const el=e.target.closest('select.bcell');if(el)stageBulk(el);});
  const bs=document.getElementById('bulksave'); if(bs)bs.onclick=()=>{ if(bulkCount())applyBulk(); };
  const bc=document.getElementById('bulkcancel'); if(bc)bc.onclick=()=>{ BULK_MODE=false; BULK={}; route(); };
  renderIndexBody(type);
}

function downscaleImage(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const max=560;let{width:w,height:h}=img;
    if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    try{cb(c.toDataURL('image/jpeg',0.82));}catch(e){cb(fr.result);}
  };img.onerror=()=>cb(null);img.src=fr.result;};
  fr.onerror=()=>cb(null);fr.readAsDataURL(file);
}

function doSave(slug){
  const e=BY[slug];const fields=EDIT_FIELDS[e.type]||[['name','Name','text'],['description','Description','textarea']];
  const changes=[];
  fields.forEach(([k,label,kind])=>{
    const el=document.getElementById('f_'+k);if(!el)return;
    let nv=el.value;
    let ov=e[k];
    if(kind==='seasons'){nv=nv.split(',').map(x=>parseInt(x.trim(),10)).filter(n=>!isNaN(n));
      if(JSON.stringify(nv)!==JSON.stringify(ov||[])){changes.push([k,(ov||[]).join(', '),nv.join(', ')]);e.seasons=nv;}return;}
    if(kind==='party'){ // resolve typed party name to an entity slug
      const nm=nv.trim();
      const match=DATA.entities.find(x=>x.type==='political_party'&&x.name.toLowerCase()===nm.toLowerCase());
      const newVal=match?match.slug:(nm||null);
      const oldName=ov&&BY[ov]?BY[ov].name:(ov||'');
      const newName=match?match.name:nm;
      if(String(newVal||'')!==String(ov||'')){changes.push(['party',oldName,newName]);e.party=newVal;}
      return;}
    if(kind==='number'){nv=nv===''?null:Number(nv);}
    ov=ov==null?'':ov; const cmp=nv==null?'':nv;
    if(String(cmp)!==String(ov)){changes.push([k,String(ov),String(cmp)]);e[k]=nv;}
  });
  // photo (person / place / party)
  if((e.type==='person'||e.type==='place'||e.type==='political_party')&&EDIT_PHOTO!==(e.photo||null)){
    changes.push(['photo',e.photo?'(image)':'(none)',EDIT_PHOTO?'(image)':'(none)']);
    if(EDIT_PHOTO)e.photo=EDIT_PHOTO;else delete e.photo;
  }
  // relations: replace this person's owned personal relations with the edited set
  if(e.type==='person'){
    const before=(RELS_A[slug]||[]).filter(r=>PERSON_RELS.includes(r.type)).map(r=>r.type+'→'+r.b).sort().join('|');
    const after=EDIT_RELS.map(r=>r.type+'→'+r.b).sort().join('|');
    if(before!==after){
      DATA.relationships=DATA.relationships.filter(r=>!(r.a===slug&&PERSON_RELS.includes(r.type)));
      EDIT_RELS.forEach(r=>DATA.relationships.push({a:slug,b:r.b,type:r.type,description:r.description||''}));
      const label=EDIT_RELS.map(r=>`${r.type} ${BY[r.b]?BY[r.b].name:r.b}`).join('; ');
      changes.push(['relations','(updated)',label||'(none)']);
    }
  }
  if(!changes.length){document.getElementById('savemsg').textContent='No changes to save.';return;}
  const now=new Date().toISOString();
  changes.forEach(([f,o,n])=>DATA.revisions.push({entity:slug,field:f,old:o,new:n,at:now}));
  reindex();
  go('#/e/'+encodeURIComponent(slug)); // navigate first so a post-publish reload lands on the article
  persist();
}

// ── HISTORY ────────────────────────────────────────────────────────────
function pageHistory(slug){
  const e=BY[slug];if(!e)return `<div class="empty">No such article.</div>`;
  const revs=DATA.revisions.filter(r=>r.entity===slug).slice().reverse();
  return `<div class="crumbs"><a href="#/e/${e.slug}">${esc(e.name)}</a><span class="sep">›</span><span>History</span></div>
    <div class="eyebrow">Revision history</div><h1 class="title">${esc(e.name)}</h1>
    ${revs.length?revs.map(r=>`<div class="rev"><span class="when">${new Date(r.at).toLocaleString()}</span>
      <span><span class="fld">${esc(r.field)}</span> — ${r.old?`<del>${esc(r.old)}</del> `:''}<ins>${esc(r.new)||'<em>(empty)</em>'}</ins></span></div>`).join('')
      :`<p class="empty">No edits recorded yet. Changes you make through <a href="#/edit/${e.slug}">Edit</a> will appear here.</p>`}`;
}

// ── persistence ────────────────────────────────────────────────────────
function fullDocument(){
  const css=document.getElementById('appstyle').textContent;
  const js=document.getElementById('appcode').textContent;
  const dataStr=JSON.stringify({meta:DATA.meta,entities:DATA.entities,relationships:DATA.relationships,heads_of_state:DATA.heads_of_state,chronology:DATA.chronology,revisions:DATA.revisions}).replace(/</g,'\u003c');
  const S='scr'+'ipt';
  // clone the static chrome and blank the dynamic regions (repopulated on load)
  const shell=document.querySelector('.shell').cloneNode(true);
  shell.className='shell';   // neutral collapse state in the published doc
  const blank=(sel,cls)=>{const el=shell.querySelector(sel);if(el){el.innerHTML='';if(cls)el.className=cls;}};
  blank('#view'); blank('#nav'); blank('#sbfoot'); blank('#results','results');
  const sb=shell.querySelector('#sidebar'); if(sb)sb.className='sidebar';
  const menu=document.getElementById('menubtn').cloneNode(true);
  const scrim=document.getElementById('scrim').cloneNode(true); scrim.className='scrim';
  const expand=document.getElementById('sbexpand').cloneNode(true);
  const fontLink='<link rel="stylesheet" href="'+FONTS+'">';
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1"><title>Amparacán</title>'+
    fontLink+'</head><body>'+
    '<style id="appstyle">'+css+'</style>'+
    menu.outerHTML+scrim.outerHTML+expand.outerHTML+shell.outerHTML+
    '<'+S+' id="wikidata" type="application/json">'+dataStr+'</'+S+'>'+
    '<'+S+' id="appcode">'+js+'</'+S+'>'+
    '</body></html>';
}
function setStatus(txt,cls){const s=document.getElementById('status');if(s){s.textContent=txt;s.className='statuschip '+(cls||'');}}
function persist(done){
  if(WRITER&&CAP){
    setStatus('Saving…','saving');
    const msg=document.getElementById('savemsg');if(msg)msg.textContent='Publishing…';
    CAP.publish(fullDocument()).then(()=>{ /* view reloads */ }).catch(err=>{
      if(err&&(err.code==='not_writer'||err.code==='not_granted'||err.code==='capability_disabled')){
        WRITER=false;LOCAL=true;saveLocal();setStatus('Saved on this device','saved');done&&done();
      }else if(err&&err.code==='conflict'){ /* reloading to winner */ }
      else{setStatus('Save failed','');if(msg)msg.textContent='Could not publish ('+(err&&err.code||'error')+'). Saved locally instead.';saveLocal();done&&done();}
    });
  }else{
    saveLocal();setStatus('Saved on this device','saved');done&&done();
  }
}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify({__local:true,data:{meta:DATA.meta,entities:DATA.entities,relationships:DATA.relationships,heads_of_state:DATA.heads_of_state,chronology:DATA.chronology,revisions:DATA.revisions}}));}catch(e){}}

// ── search ─────────────────────────────────────────────────────────────
let sIdx=-1,sHits=[];
function runSearch(term){
  const box=document.getElementById('results');
  term=term.trim().toLowerCase();
  if(!term){box.classList.remove('open');box.innerHTML='';sHits=[];return;}
  const hits=[];
  for(const e of DATA.entities){
    const n=e.name.toLowerCase();
    let sc=-1;
    if(n===term)sc=100;else if(n.startsWith(term))sc=70;else if(n.includes(term))sc=40;
    else if((e.meaning||'').toLowerCase().includes(term))sc=20;
    else if((e.description||'').toLowerCase().includes(term))sc=10;
    if(sc>0)hits.push([sc,e]);
  }
  hits.sort((a,b)=>b[0]-a[0]||a[1].name.localeCompare(b[1].name));
  sHits=hits.slice(0,12).map(h=>h[1]);sIdx=-1;
  box.innerHTML=sHits.length?sHits.map((e,i)=>`<a href="#/e/${e.slug}" data-i="${i}"><span class="rn">${esc(e.name)}</span><span class="rt">${esc(TYPE_LABEL[e.type]||e.type)}</span></a>`).join('')
    :`<a style="cursor:default"><span class="rn" style="color:var(--muted)">No matches</span></a>`;
  box.classList.add('open');
}

// ── page wiring ────────────────────────────────────────────────────────
function wirePage(){
  const savebtn=document.getElementById('savebtn');
  if(savebtn){const slug=location.hash.split('/')[2];savebtn.onclick=()=>doSave(decodeURIComponent(slug));
    const f=document.getElementById('editform');if(f)f.addEventListener('submit',e=>{e.preventDefault();doSave(decodeURIComponent(slug));});
    // right-click a highlighted selection in the text fields to insert a link
    document.querySelectorAll('#editform textarea').forEach(attachLinkMenu);}
  // person edit: photo + relations
  const photoInput=document.getElementById('photoInput');
  if(photoInput){
    renderRelList();
    photoInput.addEventListener('change',ev=>{const file=ev.target.files&&ev.target.files[0];if(!file)return;
      downscaleImage(file,url=>{if(!url){document.getElementById('savemsg').textContent='Could not read that image.';return;}
        EDIT_PHOTO=url;document.getElementById('photoPrev').innerHTML=`<img src="${url}" alt="">`;});});
    const pc=document.getElementById('photoClear');if(pc)pc.onclick=()=>{EDIT_PHOTO=null;document.getElementById('photoPrev').textContent='No photo';photoInput.value='';};
    const relAdd=document.getElementById('relAdd');
    if(relAdd)relAdd.onclick=()=>{
      const type=document.getElementById('relType').value;
      const who=document.getElementById('relWho').value.trim();
      if(!who)return;
      const match=DATA.entities.find(x=>x.type==='person'&&x.name.toLowerCase()===who.toLowerCase());
      if(!match){document.getElementById('savemsg').textContent=`No person named “${who}”. Pick an existing person.`;return;}
      document.getElementById('savemsg').textContent='';
      if(!EDIT_RELS.some(r=>r.type===type&&r.b===match.slug))EDIT_RELS.push({type,b:match.slug,description:''});
      document.getElementById('relWho').value='';renderRelList();
    };
  }
  // generic index (people / places / parties): filters, view toggle, columns
  wireIndex();
  // streets explorer
  const stbody=document.getElementById('stbody');
  if(stbody){
    const sf=document.getElementById('sfilter'),sc=document.getElementById('scat'),sn=document.getElementById('sneigh');
    const render=()=>{
      const t=(sf.value||'').toLowerCase(),cat=sc.value,ne=sn.value;
      let list=DATA.entities.filter(e=>e.type==='street');
      if(cat)list=list.filter(e=>e.category===cat);
      if(t)list=list.filter(e=>e.name.toLowerCase().includes(t)||(e.meaning||'').toLowerCase().includes(t));
      if(ne)list=list.filter(e=>streetNeighNames(e.slug).some(n=>n.name===ne));
      list.sort((a,b)=>a.name.localeCompare(b.name));
      document.getElementById('scount').textContent=list.length+' streets';
      stbody.innerHTML=list.slice(0,400).map(e=>{
        const ns=streetNeighNames(e.slug);
        return `<tr><td><a href="#/e/${e.slug}">${esc(e.name)}</a></td><td>${esc(e.street_type||'')}</td>
          <td><span class="cat">${esc(e.category||'')}</span></td><td>${esc(e.meaning||'')}</td>
          <td>${ns.map(n=>`<a href="#/e/${n.slug}">${esc(n.name)}</a>`).join(', ')}</td></tr>`;
      }).join('')+(list.length>400?`<tr><td colspan="5" class="cat">Showing first 400 of ${list.length}. Refine your filters to see more.</td></tr>`:'');
    };
    [sf,sc,sn].forEach(el=>el&&el.addEventListener('input',render));
    [sc,sn].forEach(el=>el&&el.addEventListener('change',render));
    render();
  }
  const tb=document.getElementById('themebtn');if(tb)tb.onclick=toggleTheme;
}

function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark');
  r.setAttribute('data-theme',next);try{localStorage.setItem('amparacan_theme',next);}catch(e){}}

function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
function openMenu(){document.getElementById('sidebar').classList.add('open');document.getElementById('scrim').classList.add('open');}
function setSidebar(collapsed){document.body.classList.toggle('sbc',collapsed);
  try{localStorage.setItem('amparacan_sb',collapsed?'1':'0');}catch(e){}}

// ── global listeners ───────────────────────────────────────────────────
function initListeners(){
  const q=document.getElementById('q');
  q.addEventListener('input',()=>runSearch(q.value));
  q.addEventListener('keydown',e=>{
    const box=document.getElementById('results');
    if(e.key==='ArrowDown'){e.preventDefault();sIdx=Math.min(sIdx+1,sHits.length-1);hi();}
    else if(e.key==='ArrowUp'){e.preventDefault();sIdx=Math.max(sIdx-1,0);hi();}
    else if(e.key==='Enter'){if(sHits[sIdx]){go('#/e/'+encodeURIComponent(sHits[sIdx].slug));q.value='';box.classList.remove('open');q.blur();}else if(sHits[0]){go('#/e/'+encodeURIComponent(sHits[0].slug));q.value='';box.classList.remove('open');q.blur();}}
    else if(e.key==='Escape'){box.classList.remove('open');}
  });
  function hi(){const box=document.getElementById('results');[...box.querySelectorAll('a')].forEach((a,i)=>a.classList.toggle('active',i===sIdx));}
  document.getElementById('results').addEventListener('click',()=>{setTimeout(()=>{document.getElementById('q').value='';document.getElementById('results').classList.remove('open');},0);});
  document.addEventListener('click',e=>{if(!e.target.closest('.search'))document.getElementById('results').classList.remove('open');});
  document.getElementById('menubtn').addEventListener('click',openMenu);
  document.getElementById('scrim').addEventListener('click',closeMenu);
  document.getElementById('sbcollapse').addEventListener('click',()=>setSidebar(true));
  document.getElementById('sbexpand').addEventListener('click',()=>setSidebar(false));
  // keyboard: "/" focuses search
  document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();document.getElementById('q').focus();}});
}

// ── boot ───────────────────────────────────────────────────────────────
async function boot(){
  try{const t=localStorage.getItem('amparacan_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  try{if(localStorage.getItem('amparacan_sb')==='1')document.body.classList.add('sbc');}catch(e){}
  initListeners();
  if(!location.hash)location.hash='#/';
  route();
  if(window.claude&&claude.use){
    try{CAP=await claude.use('artifact');}catch(e){CAP=null;}
    // A read-only view still resolves the namespace; the first publish that
    // rejects not_writer downgrades us to local mode (see persist()).
    if(CAP&&!LOCAL) WRITER=true;
  }
  renderNav();
  route(); // re-render so Edit affordances reflect resolved capability
}
boot();
})();
</script>
